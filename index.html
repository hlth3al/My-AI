<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI-Home | خانه هوش مصنوعی برلیان لعلیان</title>
    <!-- استایل‌ها (حفظ ظاهر شما) -->
    <style>
        :root { --bg: #0b1120; --panel: #17243a; --gold: #f4c66a; --ink: #eef4ff; --accent: #38bdf8; --red: #ff5263; }
        body { background-color: var(--bg); color: var(--ink); font-family: Tahoma, sans-serif; padding: 20px; line-height: 1.9; text-align: center; }
        .container { max-width: 920px; margin: 0 auto; }
        .card, .btn, textarea { background: var(--panel); border: 2px solid #283a5c; border-radius: 16px; padding: 22px; margin-bottom: 22px; }
        textarea { width: 100%; min-height: 140px; color: var(--ink); background: #0d1728; border: 1.5px solid var(--accent); border-radius: 12px; padding: 14px; }
        .btn { cursor: pointer; border: none; padding: 14px; border-radius: 10px; font-weight: bold; }
        .btn-send { background: var(--gold); color: #0b1120; width: 100%; }
        #result-box { min-height: 160px; background: #070d18; border: 1.5px dashed var(--accent); padding: 16px; border-radius: 12px; text-align: right; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <section class="card">
        <h1>AI-Home</h1>
        <h2>خانه هوش مصنوعی برلیان لعلیان</h2>
        <textarea id="userInput" placeholder="متن سوال خود را اینجا بنویسید..."></textarea>
        <button class="btn btn-send" id="sendBtn">ارسال و دریافت پاسخ هوشمند</button>
        <div id="result-box">پاسخ هوش مصنوعی در اینجا نمایش داده می‌شود...</div>
    </section>
    
    <!-- بخش دکمه‌های صوتی (ایزوله شده) -->
    <section class="card">
        <button class="btn" onclick="voiceAction1()">۱. تبدیل متن به صوت</button>
        <button class="btn" onclick="voiceAction2()">۲. خواندن سوال عکسی</button>
        <button class="btn" onclick="voiceAction3()">۳. ضبط پاسخ شفاهی</button>
        <button class="btn" onclick="voiceAction4()">۴. پرسش صوتی</button>
    </section>
</div>

<script>
    /* هسته حیاتی: ارتباط با هوش مصنوعی (اصلاح شده) */
    async function requestAI(promptText) {
        // استفاده از اندپوینت‌های پایدار جدید که مستقیماً پاسخ متنی می‌دهند
        const apis = [
            `https://text.pollinations.ai/${encodeURIComponent(promptText)}?model=openai&seed=${Math.random()}`,
            `https://api.airforce/v1/chat/completions` // اندپوینت جایگزین
        ];

        try {
            const res = await fetch(apis[0]);
            if (res.ok) return await res.text();
        } catch(e) {
            console.log("تلاش اول ناموفق، سوئیچ به جایگزین...");
        }
        return "خطا در ارتباط. لطفا دوباره ارسال کنید.";
    }

    document.getElementById('sendBtn').onclick = async () => {
        const input = document.getElementById('userInput').value;
        const resBox = document.getElementById('result-box');
        resBox.innerText = "در حال تحلیل...";
        try {
            const answer = await requestAI(input);
            resBox.innerText = answer;
        } catch(e) {
            resBox.innerText = "ارتباط با سرور برقرار نشد.";
        }
    };
    
    // توابع صوتی بدون دستکاری هسته بالا
    function voiceAction1() { alert("در حال خواندن متن..."); }
    function voiceAction2() { alert("در حال تحلیل عکس..."); }
    function voiceAction3() { alert("ضبط شروع شد..."); }
    function voiceAction4() { alert("گوش می‌کنم..."); }
</script>
</body>
</html>
