.group{padding:15px;border-top:4px solid var(--color);transition:.16s}

.buttons{display:flex;gap:7px;flex-wrap:wrap}
.task{

.task:hover,.task:focus-visible,.card:hover,.panel:hover,.group:hover,.bottom-card:hover{

}
.task:active{transform:scale(.96)}
.c1{--color:#39dbc4}.c2{--color:#ffbd4a}.c3{--color:#bd8cff}.c4{--color:#ff6d91}

.preview{display:flex;align-items:center;gap:12px;margin:12px 0}

.mic{font-size:0;display:inline-flex;align-items:center;gap:8px}
.mic:after{content:'ورودی صوتی';font-size:.95rem}

      $('#question').focus();
      return;
    }

    const btn = document.activeElement;
    $('#status').textContent = 'در حال تحلیل علمی و نگارش پاسخ، لطفاً شکیبا باشید…';
    $('#result').classList.remove('error');
    if(btn?.tagName === 'BUTTON') btn.disabled = true;

    const messages = [
      {
        role: 'user',
        content: imageData 
          ? [
              { type: 'text', text: promptFor(action, q) },
              { type: 'image_url', image_url: { url: imageData } }
            ]
          : promptFor(action, q)
      }
    ];

    let answer = null;
    let lastError = '';

    outerLoop:
    for (const endpoint of apiConfig.endpoints) {
      const targetUrl = endpoint.replace(/\/$/, '') + '/chat/completions';
      for (const bypass of apiConfig.corsBypasses) {
        const finalUrl = bypass(targetUrl);
        for (const model of apiConfig.models) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 28000);

            const res = await fetch(finalUrl, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'GAPGPTMASKTOKENf8lxk7fe01X1X' + apiConfig.key
              },
              body: JSON.stringify({
                model: model,
                messages: messages,
                temperature: 0.4,
                stream: false
              }),
              signal: controller.signal
            });

            clearTimeout(timeoutId);

            if (res.ok) {
              const data = await res.json();
              let text = data.choices?.[0]?.message?.content;
              if (Array.isArray(text)) text = text.map(x => x.text || '').join('\n');
              if (typeof text === 'string' && text.trim()) {
                answer = text;
                break outerLoop;
              }
            } else {
              lastError = `کد سرور: ${res.status}`;
            }
          } catch (e) {
            lastError = e.message || 'خطای اتصال به سرور';
          }
        }
      }
    }

    if (answer) {
      lastAnswer = answer;
      $('#result').innerHTML = render(answer);
      $('#status').textContent = 'پاسخ هوشمند با موفقیت دریافت و آماده شد.';
    } else {
      $('#result').innerHTML = `<p class="error">⚠️ در حال حاضر ارتباط با سامانه برقرار نشد (${lastError}). لطفاً مجدداً دکمه را کلیک فرمایید یا اتصال اینترنت را چک کنید.</p>`;
      $('#result').classList.add('error');
      $('#status').textContent = 'درخواست ناموفق بود. لطفاً دوباره تلاش کنید.';
    }

    if(btn?.tagName === 'BUTTON') btn.disabled = false;
  }

  $('#askBtn').addEventListener('click', () => ask('پاسخ به سوال'));

  $('#imageFile').onchange = e => {
    const f = e.target.files[0];
    if(!f) return;
    if(!f.type.startsWith('image/')){
      alert('لطفاً فایل تصویری معتبر انتخاب کنید.');
      return;
    }
    const r = new FileReader();
    r.onload = () => {
      imageData = r.result;
      $('#thumb').src = imageData;
      $('#preview').hidden = false;
      $('#status').textContent = 'عکس با موفقیت انتخاب شد.';
    };
    r.readAsDataURL(f);
  };

  $('#removeImage').onclick = () => {
    $('#imageFile').value = '';
    imageData = null;
    $('#preview').hidden = true;
    $('#status').textContent = 'عکس پیوست حذف گردید.';
  };

  $('#clear').onclick = () => {
    $('#question').value = '';
    $('#result').innerHTML = '';
    $('#status').textContent = 'کادر پرسش و نتایج پاک شد.';
    lastAnswer = '';
    $('#removeImage').click();
  };

  $('#copyAnswer').onclick = async () => {
    try {
      await navigator.clipboard.writeText(lastAnswer || $('#result').innerText);
      $('#status').textContent = 'پاسخ در کلیپ‌بورد کپی شد ✅';
    } catch(e) {
      $('#status').textContent = 'کپی خودکار ممکن نشد؛ متن پاسخ را به صورت دستی کپی کنید.';
    }
  };

  $$('[data-copy]').forEach(b => {
    b.onclick = async () => {
      try {
        await navigator.clipboard.writeText(b.dataset.copy);
        const originalText = b.textContent;
        b.textContent = 'کپی شد! ✅';
        setTimeout(() => b.textContent = originalText, 1400);
      } catch(e) {
        $('#status').textContent = 'کپی ممکن نشد؛ لطفاً دستی انتخاب و کپی فرمایید.';
      }
    };
  });

  $('#micBtn').onclick = () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){
      $('#status').textContent = 'تشخیص گفتار صوتی در این مرورگر پشتیبانی نمی‌شود.';
      return;
    }
    const r = new SR();
    r.lang = 'fa-IR';
    r.interimResults = false;
    r.onstart = () => $('#status').textContent = 'در حال شنیدن گفتار شما…';
    r.onresult = e => {
      $('#question').value += ($('#question').value ? ' ' : '') + e.results[0][0].transcript;
      $('#status').textContent = 'گفتار به متن تبدیل و در کادر درج شد.';
    };
    r.onerror = e => $('#status').textContent = 'خطای میکروفن یا عدم دسترسی صوتی: ' + (e.error || '');
    r.start();
  };

  function speakAnswer(){
    if(!lastAnswer){
      $('#status').textContent = 'ابتدا سوالی بپرسید تا پاسخ دریافت شود.';
      return false;
    }
    if(!('speechSynthesis' in window)){
      $('#status').textContent = 'پخش گفتار در این مرورگر پشتیبانی نمی‌شود.';
      return false;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(lastAnswer);
    u.lang = 'fa-IR';
    u.onstart = () => $('#status').textContent = 'پاسخ با صدای سیستم در حال پخش است…';
    u.onerror = e => $('#status').textContent = 'خطای پخش صوت مرورگر: ' + (e.error || '');
    speechSynthesis.speak(u);
    return true;
  }
  $('#voiceBtn').onclick = speakAnswer;

  $('#saveAudio').onclick = async () => {
    if(!lastAnswer){
      $('#status').textContent = 'ابتدا پاسخ دریافت کنید.';
      return;
    }
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
      $('#status').textContent = 'ضبط صدا در این مرورگر پشتیبانی نمی‌شود.';
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      recorder = new MediaRecorder(stream);
      chunks = [];
      recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, {type: recorder.mimeType || 'audio/webm'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Class-AI-Response.webm';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        stream.getTracks().forEach(t => t.stop());
      };
      recorder.start();
      const u = new SpeechSynthesisUtterance(lastAnswer);
      u.lang = 'fa-IR';
      u.onend = () => { if(recorder?.state === 'recording') recorder.stop(); };
      u.onerror = () => { if(recorder?.state === 'recording') recorder.stop(); };
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      $('#status').textContent = 'در حال پخش و ضبط فایل صوتی؛ به محض اتمام، فایل دانلود خواهد شد.';
    }catch(e){
      $('#status').textContent = 'ضبط انجام نشد (دسترسی به میکروفن داده نشد).';
    }
  };

  /* ارسال سریع با ترکیب کلیدهای Ctrl+Enter در کادر متنی */
  $('#question').addEventListener('keydown', e => {
    if((e.ctrlKey || e.metaKey) && e.key === 'Enter') ask('پاسخ به سوال');
  });

})();
</script>
</body>
</html>
