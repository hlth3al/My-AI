<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>گفتگو با GapGPT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 12px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    .header-top h1 { font-size: 1.1rem; color: #38bdf8; }
    .status-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 999px; background: #334155; color: #94a3b8; }
    .status-badge.active { background: #065f46; color: #34d399; }
    
    .api-panel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .api-panel input, .api-panel select { background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }
    .api-panel input[type="password"] { flex: 1; min-width: 220px; }
    .api-panel button { background: #0284c7; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: bold; }
    .api-panel button:hover { background: #0369a1; }
    
    #chat-box { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 85%; padding: 10px 14px; border-radius: 10px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; }
    .message.user { align-self: flex-start; background: #0284c7; color: white; border-bottom-right-radius: 2px; }
    .message.assistant { align-self: flex-end; background: #1e293b; border: 1px solid #334155; border-bottom-left-radius: 2px; direction: rtl; text-align: right; }
    .message.error { align-self: center; background: #7f1d1d; color: #fecaca; border: 1px solid #dc2626; font-size: 0.85rem; }

    #input-container { background: #1e293b; padding: 12px 16px; border-top: 1px solid #334155; display: flex; gap: 8px; align-items: center; }
    #message-input { flex: 1; background: #0f172a; border: 1px solid #475569; color: #f8fafc; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; outline: none; }
    #message-input:focus { border-color: #38bdf8; }
    #send-btn { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 0.95rem; cursor: pointer; font-weight: bold; }
    #send-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="header-top">
      <h1>دستیار چت هوشمند (GapGPT)</h1>
      <span id="conn-status" class="status-badge">کلید وارد نشده</span>
    </div>
    <div class="api-panel">
      <input type="password" id="api-key" placeholder="کلید API گپ‌جی‌پی‌تی را وارد کنید...">
      <select id="model-select">
        <option value="gpt-4o-mini">gpt-4o-mini (سریع و به‌صرفه)</option>
        <option value="gpt-4o">gpt-4o (قدرتمند)</option>
      </select>
      <button onclick="saveAndCheckKey()">ذخیره و تست</button>
    </div>
  </header>

  <div id="chat-box">
    <div class="message assistant">
      سلام! لطفاً کلید API گپ‌جی‌پی‌تی خود را در کادر بالای صفحه قرار داده و روی «ذخیره و تست» بزنید تا گفتگو آغاز شود.
    </div>
  </div>

  <div id="input-container">
    <input type="text" id="message-input" placeholder="پیام خود را بنویسید..." onkeypress="handleKeyPress(event)">
    <button id="send-btn" onclick="sendMessage()">ارسال</button>
  </div>

  <script>
    const ENDPOINTS = [
      "https://api.gapgpt.app/v1/chat/completions",
      "https://api.gapapi.com/v1/chat/completions"
    ];

    let conversationHistory = [
      { role: "system", content: "شما یک دستیار هوشمند، مفید و مؤدب هستید که به زبان فارسی پاسخ می‌دهید." }
    ];

    // بارگذاری خودکار کلید ذخیره‌شده
    window.addEventListener("DOMContentLoaded", () => {
      const savedKey = localStorage.getItem("gapgpt_api_key");
      if (savedKey) {
        document.getElementById("api-key").value = savedKey;
        setConnected(true);
      }
    });

    function saveAndCheckKey() {
      const key = document.getElementById("api-key").value.trim();
      if (!key) {
        alert("لطفاً ابتدا کلید API را وارد کنید.");
        return;
      }
      localStorage.setItem("gapgpt_api_key", key);
      setConnected(true);
      alert("کلید API با موفقیت در مرورگر ذخیره شد!");
    }

    function setConnected(active) {
      const badge = document.getElementById("conn-status");
      if (active) {
        badge.textContent = "متصل";
        badge.className = "status-badge active";
      } else {
        badge.textContent = "کلید نامعتبر یا ذخیره نشده";
        badge.className = "status-badge";
      }
    }

    function handleKeyPress(e) {
      if (e.key === "Enter") sendMessage();
    }

    async function sendMessage() {
      const inputEl = document.getElementById("message-input");
      const userText = inputEl.value.trim();
      const apiKey = document.getElementById("api-key").value.trim() || localStorage.getItem("gapgpt_api_key");
      const model = document.getElementById("model-select").value;
      const sendBtn = document.getElementById("send-btn");

      if (!apiKey) {
        alert("لطفاً ابتدا کلید API را در کادر بالا وارد کنید.");
        return;
      }
      if (!userText) return;

      // ۱. نمایش پیام کاربر در چت
      appendMessage("user", userText);
      conversationHistory.push({ role: "user", content: userText });
      inputEl.value = "";
      sendBtn.disabled = true;

      // ساخت پیام در حال پاسخ
      const tempId = appendMessage("assistant", "در حال دریافت پاسخ از سرور...");

      let success = false;
      let detailedErrors = [];

      // تلاش برای ارسال از طریق مسیرهای دوگانه برای رفع خطای ۴۰۳
      for (const endpoint of ENDPOINTS) {
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${apiKey}`
            },
            body: JSON.stringify({
              model: model,
              messages: conversationHistory,
              max_tokens: 2000
            })
          });

          if (response.ok) {
            const data = await response.json();
            const aiReply = data.choices[0]?.message?.content || "پاسخی دریافت نشد.";
            
            // به‌روزرسانی متن در کادر چت
            updateMessage(tempId, aiReply);
            conversationHistory.push({ role: "assistant", content: aiReply });
            success = true;
            break;
          } else {
            const errBody = await response.text();
            detailedErrors.push(`[${response.status}] روی ${endpoint}: ${errBody}`);
          }
        } catch (netErr) {
          detailedErrors.push(`خطای شبکه روی ${endpoint}: ${netErr.message}`);
        }
      }

      if (!success) {
        updateMessage(tempId, "خطا در اتصال به GapGPT:\n" + detailedErrors.join("\n\n"), true);
      }

      sendBtn.disabled = false;
    }

    function appendMessage(role, text) {
      const box = document.getElementById("chat-box");
      const msgDiv = document.createElement("div");
      const id = "msg-" + Date.now();
      msgDiv.id = id;
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      box.appendChild(msgDiv);
      box.scrollTop = box.scrollHeight;
      return id;
    }

    function updateMessage(id, text, isError = false) {
      const el = document.getElementById(id);
      if (el) {
        el.innerText = text;
        if (isError) el.className = "message error";
      }
      const box = document.getElementById("chat-box");
      box.scrollTop = box.scrollHeight;
    }
  </script>
</body>
</html>
