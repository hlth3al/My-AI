<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه جامع پردازش علمی و تحلیلی | Platform My-AI</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif; }
  :root{
    --bg:#0b1220; --card:#121b2e; --card2:#0f1830; --line:#1f2b47;
    --txt:#e8eefc; --muted:#9fb0d0; --acc:#3b82f6; --acc2:#22d3ee; --ok:#34d399;
  }
  body{ background:var(--bg); color:var(--txt); line-height:1.9; }
  a{ color:var(--acc2); text-decoration:none; }
  .container{ max-width:1080px; margin:0 auto; padding:0 16px; }

  header{ position:sticky; top:0; z-index:50; background:rgba(11,18,32,.85); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; align-items:center; justify-content:space-between; height:64px; }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.05rem; }
  .logo .dot{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:linear-gradient(135deg,var(--acc),var(--acc2)); color:#fff; font-weight:900; }
  
  .hero{ padding:64px 0 40px; text-align:center; background:radial-gradient(900px 300px at 50% -60px, rgba(59,130,246,.18), transparent); }
  .badge{ display:inline-block; padding:6px 14px; border:1px solid var(--line); border-radius:999px; color:var(--muted); font-size:.8rem; margin-bottom:18px; }
  .hero h1{ font-size:clamp(1.4rem,4vw,2.2rem); font-weight:900; margin-bottom:10px; }
  .hero p.sub{ color:var(--muted); max-width:720px; margin:0 auto 8px; }
  .hero p.lead{ color:var(--muted); max-width:760px; margin:0 auto 26px; font-size:.95rem; }
  .cta{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn{ cursor:pointer; border:none; border-radius:12px; padding:12px 22px; font-size:.95rem; font-weight:700; transition:.2s; }
  .btn-primary{ background:linear-gradient(135deg,var(--acc),#2563eb); color:#fff; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 10px 25px rgba(59,130,246,.35); }
  .btn-ghost{ background:transparent; color:var(--txt); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--acc); }

  section{ padding:40px 0; }
  .sec-title{ font-size:1.25rem; font-weight:800; margin-bottom:6px; }
  .sec-desc{ color:var(--muted); font-size:.9rem; margin-bottom:22px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media(max-width:720px){ .grid2{ grid-template-columns:1fr; } }
  label{ display:block; font-size:.85rem; color:var(--muted); margin:12px 0 6px; }
  select, textarea, input[type=text]{
    width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt);
    border-radius:12px; padding:12px 14px; font-size:.95rem; outline:none; transition:.2s;
  }
  textarea{ min-height:130px; resize:vertical; }
  .filebox{ display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .filebtn{ cursor:pointer; border:1px dashed var(--line); border-radius:12px; padding:10px 16px; color:var(--muted); font-size:.85rem; }
  #imgName{ font-size:.8rem; color:var(--ok); }
  .send{ margin-top:16px; width:100%; }

  #answerWrap{ display:none; margin-top:18px; }
  #answerHead{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  #answerBox{ background:var(--card2); border:1px solid var(--line); border-radius:14px; padding:18px; min-height:80px; white-space:pre-wrap; font-size:.95rem; }
  .spin{ display:inline-block; width:16px; height:16px; border:2px solid var(--acc); border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; vertical-align:-3px; margin-left:6px; }
  @keyframes sp{ to{ transform:rotate(360deg);} }

  .tools{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .tool{ cursor:pointer; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; transition:.2s; }
  .tool:hover{ border-color:var(--acc); transform:translateY(-3px); }
  
  .levels{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .lvl{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; text-align:center; font-size:.85rem; color:var(--muted); }
  
  .fin{ display:grid; gap:12px; }
  .finrow{ display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:14px; flex-wrap:wrap; }
  .finrow .val{ direction:ltr; font-family:monospace; font-size:1rem; letter-spacing:1px; }
  .finrow .lbl{ color:var(--muted); font-size:.85rem; }
  footer{ border-top:1px solid var(--line); padding:22px 0; text-align:center; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="logo"><span class="dot">AI</span> Platform My-AI</div>
  </div>
</header>

<div class="hero container">
  <h1>پلتفرم هوش مصنوعی من — Platform My-AI</h1>
  <p class="sub"><b>شرکت پردرآمد تهرانی‌ها</b> با هدایت علمی <b>حسین لعلیان</b></p>
</div>

<section id="workspace" class="container">
  <h2 class="sec-title">میز کار</h2>
  <div class="card">
      <label for="levelSel">مقطع و سطح علمی</label>
      <select id="levelSel">
        <option>عمومی</option>
        <option>پیش‌دبستانی و اول دبستان</option>
        <option>دبستان</option>
        <option>متوسطه اول</option>
        <option>متوسطه دوم</option>
        <option>کنکور</option>
        <option>دانشگاه</option>
      </select>

    <label for="qInput">متن سوال</label>
    <textarea id="qInput" placeholder="سوال خود را بنویسید..."></textarea>

    <div class="filebox">
      <label class="filebtn" for="imgInput">📷 انتخاب عکس</label>
      <input type="file" id="imgInput" accept="image/*" hidden>
      <span id="imgName"></span>
    </div>

    <button class="btn btn-primary send" id="sendBtn" onclick="processAIRequest()">🚀 دریافت پاسخ</button>

    <div id="answerWrap">
      <div id="answerHead"><h3>پاسخ:</h3></div>
      <div id="answerBox">در حال پردازش...</div>
    </div>
  </div>
</section>

<script>
/** 
 * تنظیمات اتصال به گپ‌جی‌پی‌تی 
 * لطفاً کلید API خود را در اینجا جایگذاری کنید
 **/
const API_CONFIG = {
    key: "YOUR_API_KEY_HERE", 
    endpoints: ["https://api.gapgpt.app/v1/chat/completions", "https://api.gapapi.com/v1/chat/completions"],
    models: ["gpt-4o-mini", "gpt-4o"]
};

let imageData = null;

// مدیریت تصویر
document.getElementById("imgInput").addEventListener("change", function(e){
    const f = e.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = ev => { 
        imageData = ev.target.result; 
        document.getElementById("imgName").innerText = "✔ " + f.name; 
    };
    r.readAsDataURL(f);
});

async function processAIRequest(){
    const q = document.getElementById("qInput").value.trim();
    const level = document.getElementById("levelSel").value;
    const box = document.getElementById("answerBox");
    const wrap = document.getElementById("answerWrap");
    const btn = document.getElementById("sendBtn");

    if(!q && !imageData){ alert("لطفاً سوال یا عکس را وارد کنید."); return; }

    wrap.style.display = "block";
    box.innerHTML = '<span class="spin"></span> در حال تحلیل علمی...';
    btn.disabled = true;

    const systemPrompt = `شما دستیار آموزشی هوشمند پلتفرم My-AI هستید. وظیفه شما حل گام‌به‌گام و دقیق سوالات در مقطع «${level}» با بالاترین کیفیت است.`;
    
    const userContent = imageData 
        ? [{type:"text", text: q || "حل گام‌به‌گام این سوال:"}, {type:"image_url", image_url:{url: imageData}}]
        : q;

    let success = false;

    // تلاش برای اتصال با Failover خودکار (ایده کُد ب)
    for(const endpoint of API_CONFIG.endpoints) {
        for(const model of API_CONFIG.models) {
            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_CONFIG.key}`
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [{role: "system", content: systemPrompt}, {role: "user", content: userContent}]
                    })
                });

                if(response.ok) {
                    const data = await response.json();
                    box.innerText = data.choices[0].message.content;
                    success = true;
                    break;
                }
            } catch(e) { continue; }
        }
        if(success) break;
    }

    if(!success) {
        box.innerText = "خطا در ارتباط با سرور. لطفاً کلید API خود را بررسی کنید.";
    }
    btn.disabled = false;
}
</script>
</body>
</html>
