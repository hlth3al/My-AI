<script>
// ۱. سیستم صدای تعاملی (Chime)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playBeep() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
}

// گوش دادن به کلیک‌ها برای پخش صدا
document.addEventListener('click', (e) => {
    if(e.target.matches('button, .pkg-item, textarea')) playBeep();
});

// ۲. انتخاب بسته
function selectPkg(el) {
    document.querySelectorAll('.pkg-item').forEach(i => i.classList.remove('selected'));
    el.classList.add('selected');
}

// ۳. موتور هوشمند با سیستم Fallback (جلوگیری از ۵۰۳)
async function getAIResponse(text) {
    const endpoints = [
        `https://text.pollinations.ai/${encodeURIComponent(text)}?model=openai`,
        `https://text.pollinations.ai/${encodeURIComponent(text)}?model=mistral`
    ];

    for (let url of endpoints) {
        try {
            const response = await fetch(url);
            if (response.ok) return await response.text();
        } catch (err) {
            console.warn("تلاش مجدد با سرور بعدی...");
        }
    }
    throw new Error("سرویس‌دهنده‌ها شلوغ هستند. لطفاً دوباره کلیک کنید.");
}

document.getElementById('sendBtn').onclick = async () => {
    const input = document.getElementById('userInput').value;
    const output = document.getElementById('result');
    if(!input) return alert("لطفاً سوال را وارد کنید.");
    
    output.innerText = "در حال اتصال و تحلیل...";
    try {
        const answer = await getAIResponse(input);
        output.innerText = answer;
    } catch(err) {
        output.innerText = err.message;
    }
};
</script>
