<script>
// تابع ارسال سوال دانش‌آموز به API
async function sendQuestionToAI() {
  const questionInput = document.getElementById("questionInput"); // آی‌دی کادر سوال
  const responseBox = document.getElementById("responseBox");     // آی‌دی کادر پاسخ
  const levelSelect = document.getElementById("levelSelect");     // آی‌دی مقطع تحصیلی

  const userQuestion = questionInput.value.trim();
  const studentLevel = levelSelect ? levelSelect.value : "عمومی";

  if (!userQuestion) {
    alert("لطفاً ابتدا سوال خود را بنویسید.");
    return;
  }

  responseBox.innerHTML = "⏳ در حال تحلیل علمی و نگارش پاسخ، لطفاً شکیبا باشید...";

  try {
    // آدرس اندپوینت API (مدل سازگار با OpenAI)
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        // کلید اختصاصی API شما
        "Authorization": "Bearer YOUR_API_KEY_HERE"
      },
      body: JSON.stringify({
        model: "gpt-4o-mini", // یا هر مدل تحلیلی مدنظرتان
        messages: [
          {
            role: "system",
            content: `شما یک دستیار هوشمند و تحلیل‌گر علمی تحت نظارت حسین لعلیان هستید. وظیفه شما حل گام‌به‌گام، تشریحی و دقیق سوالات دانش‌آموزان در مقطع ${studentLevel} با بالاترین کیفیت آموزشی و بیانی روان است.`
          },
          {
            role: "user",
            content: userQuestion
          }
        ],
        temperature: 0.3
      })
    });

    const data = await response.json();

    if (data.choices && data.choices[0]) {
      // نمایش پاسخ در کادر مربوطه
      responseBox.innerText = data.choices[0].message.content;
    } else {
      responseBox.innerText = "خطا در دریافت پاسخ: " + (data.error?.message || "مشکلی رخ داده است.");
    }
  } catch (error) {
    responseBox.innerText = "خطای ارتباط با سرور هوش مصنوعی: " + error.message;
  }
}
</script>
<script>
// اتصال دکمه فرم به هوش مصنوعی رایگان
async function solveQuestion() {
  // گرفتن ورودی سوال، کادر پاسخ و مقطع تحصیلی
  const questionInput = document.querySelector("textarea") || document.querySelector("input[type='text']");
  const resultBox = document.getElementById("responseBox") || document.querySelector(".response-box") || document.querySelector(".answer");

  if (!questionInput || !questionInput.value.trim()) {
    alert("لطفاً ابتدا سوال خود را بنویسید.");
    return;
  }

  const userQuestion = questionInput.value.trim();

  if (resultBox) {
    resultBox.style.display = "block";
    resultBox.innerHTML = "⏳ در حال پردازش علمی و نگارش پاسخ تشریحی، لطفاً شکیبا باشید...";
  }

  try {
    const prompt = encodeURIComponent(
      "شما دستیار تخصصی حل مسئله و تحلیل علمی پلتفرم حسین لعلیان هستید. این سوال را کاملاً دقیق، علمی، گام‌به‌گام و با زبان فارسی تشریحی پاسخ دهید: " + userQuestion
    );

    const response = await fetch(`https://text.pollinations.ai/${prompt}?model=openai`);
    const answer = await response.text();

    if (resultBox) {
      resultBox.innerText = answer;
    }
  } catch (error) {
    if (resultBox) {
      resultBox.innerText = "خطا در برقراری ارتباط با سامانه تحلیل‌گر. لطفاً اتصال اینترنت خود را بررسی کنید.";
    }
  }
}

// متصل کردن دکمه ارسال به تابع بالا
document.addEventListener("DOMContentLoaded", function() {
  const submitBtn = document.querySelector("button") || document.querySelector(".btn-submit");
  if (submitBtn) {
    submitBtn.onclick = function(e) {
      e.preventDefault();
      solveQuestion();
    };
  }
});
</script>
