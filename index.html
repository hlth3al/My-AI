<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه جامع پردازش علمی | Platform My-AI</title>
<style>
  :root {
    --bg:#0b1220; --card:#121b2e; --card2:#0f1830; --line:#1f2b47;
    --txt:#e8eefc; --muted:#9fb0d0; --acc:#3b82f6; --acc2:#22d3ee; --ok:#34d399;
    --c1:#39dbc4; --c2:#ffbd4a; --c3:#bd8cff; --c4:#ff6d91; --c5:#63b7ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Vazirmatn","Segoe UI",Tahoma,Arial,sans-serif; }
  body { background:var(--bg); color:var(--txt); line-height:1.9; }
  .container { max-width:1100px; margin:0 auto; padding:0 20px; }
  header { position:sticky; top:0; z-index:50; background:rgba(11,18,32,.9); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:15px 0; }
  .nav { display:flex; align-items:center; justify-content:space-between; }
  .logo { font-weight:800; font-size:1.2rem; color:var(--acc2); }
  
  .hero { padding:60px 0; text-align:center; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:25px; margin-bottom:20px; }
  
  .sec-title { font-size:1.4rem; margin:30px 0 15px; color:#fff; }
  
  /* Tools & Levels */
  .grid-tools { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:15px; }
  .btn-tool { background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:15px; cursor:pointer; text-align:right; transition:.2s; font-size:.9rem; }
  .btn-tool:hover { border-color:var(--acc); transform:translateY(-3px); }
  
  /* Inputs */
  textarea { width:100%; background:var(--card2); border:1px solid var(--line); color:var(--txt); border-radius:12px; padding:15px; min-height:150px; margin:10px 0; resize:vertical; }
  .btn-action { background:linear-gradient(135deg,var(--acc),#2563eb); color:#fff; border:none; padding:15px 30px; border-radius:12px; font-weight:bold; cursor:pointer; width:100%; }
  
  /* Results */
  #answerWrap { display:none; margin-top:20px; }
  #answerBox { background:#0d1328; border:1px solid var(--line); border-radius:12px; padding:20px; min-height:100px; white-space:pre-wrap; }
  
  .spin { display:inline-block; width:20px; height:20px; border:3px solid var(--acc); border-top-color:transparent; border-radius:50%; animation:sp 1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  
  footer { text-align:center; padding:40px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <div class="logo">Platform My-AI</div>
  </div>
</header>

<div class="hero container">
  <h1>پلتفرم هوش مصنوعی من</h1>
  <p>هدایت علمی: <b>حسین لعلیان</b> (رتبه ۳۲ کنکور دکتری)</p>
</div>

<section class="container">
  <div class="card">
    <label>متن سوال یا مبحث خود را بنویسید:</label>
    <textarea id="qInput" placeholder="سوال خود را اینجا وارد کنید..."></textarea>
    
    <div style="display:flex; gap:10px; margin-bottom:20px;">
      <label class="btn-tool" for="imgInput" style="margin:0;">📷 انتخاب تصویر</label>
      <input type="file" id="imgInput" accept="image/*" hidden>
      <button class="btn-action" onclick="askAI()">🚀 دریافت پاسخ هوشمند</button>
    </div>
    
    <div id="answerWrap">
      <div id="answerHead" style="display:flex; justify-content:space-between; margin-bottom:10px;">
        <h3>پاسخ تحلیلی:</h3>
        <button class="btn-tool" onclick="copyAnswer()">📋 کپی پاسخ</button>
      </div>
      <div id="answerBox">در انتظار پرسش...</div>
    </div>
  </div>

  <h2 class="sec-title">ابزارهای تخصصی</h2>
  <div class="grid-tools" id="toolContainer"></div>
</section>

<footer>
  تمامی حقوق متعلق به حسین لعلیان می‌باشد.
</footer>

<script>
/* تنظیمات مرکزی - کلید API در اینجا قرار دارد اما در رابط کاربری نمایش داده نمی‌شود */
const CONFIG = {
    key: "GAPGPTMASKTOKENcivhhd4apztX0X", // کلید مخفی
    endpoints: ["https://api.gapgpt.app/v1/chat/completions", "https://api.gapapi.com/v1/chat/completions"],
    models: ["gpt-4o-mini", "gpt-4o"]
};

const tools = [
    'آنالیز تست کنکور و حذف گزینه‌ها', 'حل تشریحی گام‌به‌گام تمرین', 'آموزش مفهوم از پایه',
    'نگارش و ویرایش مقاله ISI', 'برنامه‌ریزی درسی هفتگی', 'ترجمه تخصصی متون',
    'آنالیز تله‌های آموزشی', 'حل مسائل دارای جدول و نمودار', 'طراحی آزمون تستی'
];

// تولید ابزارها
const toolContainer = document.getElementById('toolContainer');
tools.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'btn-tool';
    btn.textContent = t;
    btn.onclick = () => {
        document.getElementById('qInput').value = t + " : ";
        document.getElementById('qInput').focus();
        window.scrollTo({top: 0, behavior: 'smooth'});
    };
    toolContainer.appendChild(btn);
});

let imageData = null;
document.getElementById('imgInput').onchange = e => {
    const f = e.target.files[0];
    const r = new FileReader();
    r.onload = ev => { imageData = ev.target.result; alert("تصویر بارگذاری شد."); };
    r.readAsDataURL(f);
};

async function askAI() {
    const q = document.getElementById('qInput').value.trim();
    const box = document.getElementById('answerBox');
    const wrap = document.getElementById('answerWrap');
    
    if(!q && !imageData) { alert("لطفاً سوال یا عکس وارد کنید"); return; }
    
    wrap.style.display = "block";
    box.innerHTML = '<span class="spin"></span> در حال تحلیل علمی...';
    
    let success = false;
    for(const endpoint of CONFIG.endpoints) {
        for(const model of CONFIG.models) {
            try {
                const response = await fetch(endpoint, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${CONFIG.key}` },
                    body: JSON.stringify({
                        model: model,
                        messages: [{role: "user", content: imageData ? [{type:"text", text:q}, {type:"image_url", image_url:{url:imageData}}] : q}]
                    })
                });
                
                if(response.ok) {
                    const data = await response.json();
                    box.innerText = data.choices[0].message.content;
                    success = true;
                    break;
                }
            } catch(e) { continue; }
        }
        if(success) break;
    }
    
    if(!success) box.innerText = "خطا در ارتباط با سرور. لطفاً مجدداً تلاش کنید.";
}

function copyAnswer(){
    navigator.clipboard.writeText(document.getElementById('answerBox').innerText);
    alert("پاسخ کپی شد.");
}
</script>
</body>
</html>
