let audioCtx = null;
function beep() {
  if (!byId('soundToggle').checked) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.value = 600;
    g.gain.setValueAtTime(.02, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + .04);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + .045);
  } catch(e) {}
}
document.addEventListener('pointerover', e => {
  if (e.target.closest('.btn, details summary, .package')) beep();
});

// مدیریت تصویر
const fileInput = byId('image');
let imageData = null;
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    imageData = r.result;
    byId('preview').src = imageData;
    byId('preview').style.display = 'block';
  };
  r.readAsDataURL(f);
});

byId('removeImage').onclick = () => {
  imageData = null;
  fileInput.value = '';
  byId('preview').removeAttribute('src');
  byId('preview').style.display = 'none';
};

function setStatus(text, kind = '') {
  const n = byId('status');
  n.textContent = text;
  n.className = 'status ' + kind;
}
