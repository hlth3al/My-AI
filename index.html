<script>
/* ============================================================
   اتصال تمام دکمه‌های ۱۳ زیرگروه به پاسخ هوش مصنوعی
   ============================================================ */

const AI_ANALYZE_ENDPOINT = "/api/analyze";

const galleryInput = document.getElementById("gallery-input");
const answerPanel = document.getElementById("answer-panel");
const answerStatus = document.getElementById("answer-status");
const answerBody = document.getElementById("ai-answer");

const selectedGroup = document.getElementById("selected-group");
const selectedSubgroup = document.getElementById("selected-subgroup");
const selectedAction = document.getElementById("selected-action");
const selectedLevel = document.getElementById("selected-level");

const previewBox = document.getElementById("answer-preview-box");
const questionPreview = document.getElementById("question-preview");

let selectedImageFile = null;
let pendingSelection = null;
let previewUrl = null;

/* صداهای متفاوت برای ۱۳ زیرگروه */
const AudioContextClass =
  window.AudioContext || window.webkitAudioContext;

let audioContext = null;

const subgroupTones = {
  1: [261.63, 523.25],
  2: [293.66, 587.33],
  3: [329.63, 659.25],
  4: [349.23, 698.46],
  5: [392.00, 783.99],
  6: [440.00, 880.00],
  7: [493.88, 987.77],
  8: [523.25, 1046.50],
  9: [587.33, 1174.66],
  10: [659.25, 1318.51],
  11: [698.46, 1396.91],
  12: [783.99, 1567.98],
  13: [880.00, 1760.00]
};

function playSubgroupSound(subgroupNumber) {
  try {
    if (!AudioContextClass) return;

    if (!audioContext) {
      audioContext = new AudioContextClass();
    }

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const tones =
      subgroupTones[String(subgroupNumber)] ||
      subgroupTones[subgroupNumber] ||
      [440, 880];

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(tones[0], now);
    oscillator.frequency.exponentialRampToValueAtTime(
      tones[1],
      now + 0.18
    );

    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.32);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.34);
  } catch (error) {
    console.warn("صدای مرورگر قابل پخش نیست:", error);
  }
}

/* نمایش پیام وضعیت */
function setStatus(message, type = "") {
  answerStatus.textContent = message;
  answerStatus.className = "answer-status";

  if (type) {
    answerStatus.classList.add(type);
  }
}

/* رفتن سریع به کادر پاسخ */
function goToAnswerPanel() {
  answerPanel.classList.add("visible");

  setTimeout(() => {
    answerPanel.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 80);
}

/* تبدیل متن دکمه به اطلاعات قابل ارسال */
function getButtonInformation(button, subgroupContainer) {
  const subgroupTitle =
    subgroupContainer.querySelector(".subgroup-title");

  const subgroupText = subgroupTitle
    ? subgroupTitle.innerText.trim().replace(/\s+/g, " ")
    : "زیرگروه نامشخص";

  const buttonText =
    button.innerText.trim().replace(/\s+/g, " ");

  const levelMatch = buttonText.match(/در سطح (.+)$/);

  const academicLevel = levelMatch
    ? levelMatch[1].trim()
    : "سطح علمی تعیین‌شده در متن دکمه";

  const soundId =
    subgroupContainer.getAttribute("data-sound") ||
    subgroupText.match(/\b(1[0-3]|[1-9])\b/)?.[1] ||
    "1";

  return {
    groupTitle: "The question in the picture",
    subgroupTitle: subgroupText,
    actionTitle: buttonText,
    academicLevel,
    soundId,
    button,
    subgroupContainer
  };
}

/* نمایش مشخصات انتخاب */
function showSelectionInformation(selection) {
  selectedGroup.textContent = selection.groupTitle;
  selectedSubgroup.textContent = selection.subgroupTitle;
  selectedAction.textContent = selection.actionTitle;
  selectedLevel.textContent = selection.academicLevel;
}

/* نمایش تصویر انتخاب‌شده */
function showSelectedImage(file) {
  if (!file) return;

  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
  }

  previewUrl = URL.createObjectURL(file);
  questionPreview.src = previewUrl;
  previewBox.classList.add("visible");
}

/* انتخاب عکس از گالری */
galleryInput.addEventListener("change", async function () {
  const file = galleryInput.files && galleryInput.files[0];

  if (!file) {
    return;
  }

  if (!file.type.startsWith("image/")) {
    setStatus("فایل انتخاب‌شده تصویر نیست.", "error");
    goToAnswerPanel();
    return;
  }

  selectedImageFile = file;
  showSelectedImage(file);

  setStatus(
    "تصویر با موفقیت دریافت شد. پاسخ در حال آماده‌سازی است.",
    "success"
  );

  /*
    اگر کاربر ابتدا دکمه را زده و بعد گالری باز شده باشد،
    همان دکمه بلافاصله اجرا می‌شود.
  */
  if (pendingSelection) {
    const selectionToRun = pendingSelection;
    pendingSelection = null;
    await requestAiAnswer(selectionToRun);
  }
});

/* ارسال عکس و اطلاعات دکمه به سرور هوش مصنوعی */
async function requestAiAnswer(selection) {
  if (!selectedImageFile) {
    pendingSelection = selection;

    showSelectionInformation(selection);

    setStatus(
      "ابتدا عکس سؤال را از گالری انتخاب کنید. پس از انتخاب عکس، همین درخواست به‌صورت خودکار اجرا می‌شود.",
      "error"
    );

    goToAnswerPanel();

    setTimeout(() => {
      galleryInput.click();
    }, 180);

    return;
  }

  showSelectionInformation(selection);
  goToAnswerPanel();

  selection.button.classList.add("is-loading");

  setStatus(
    "هوش مصنوعی در حال خواندن تصویر و آماده‌کردن پاسخ متناسب با زیرگروه و سطح علمی شماست...",
    "loading"
  );

  answerBody.textContent =
    "لطفاً چند لحظه صبر کنید. پاسخ در حال تولید است...";

  const formData = new FormData();

  formData.append("image", selectedImageFile);
  formData.append("group_title", selection.groupTitle);
  formData.append("subgroup_title", selection.subgroupTitle);
  formData.append("button_title", selection.actionTitle);
  formData.append("academic_level", selection.academicLevel);

  try {
    const response = await fetch(AI_ANALYZE_ENDPOINT, {
      method: "POST",
      body: formData
    });

    let result = {};

    try {
      result = await response.json();
    } catch (jsonError) {
      throw new Error(
        "پاسخ معتبر از سرور دریافت نشد."
      );
    }

    if (!response.ok) {
      throw new Error(
        result.error ||
        "ارتباط با هوش مصنوعی با خطا مواجه شد."
      );
    }

    const finalAnswer =
      result.answer ||
      result.output ||
      "هوش مصنوعی پاسخ متنی ارسال نکرد.";

    answerBody.textContent = finalAnswer;

    setStatus(
      "پاسخ هوش مصنوعی با موفقیت دریافت شد.",
      "success"
    );

  } catch (error) {
    console.error(error);

    answerBody.textContent =
      "پاسخ دریافت نشد.\n\n" +
      "علت احتمالی:\n" +
      error.message +
      "\n\n" +
      "لطفاً اتصال اینترنت و اجرای سرور هوش مصنوعی را بررسی کنید.";

    setStatus(
      "در دریافت پاسخ از هوش مصنوعی خطایی رخ داد.",
      "error"
    );
  } finally {
    selection.button.classList.remove("is-loading");
  }
}

/* اتصال خودکار تمام دکمه‌های تمام زیرگروه‌ها */
document.querySelectorAll(".subgroup-container").forEach(
  (subgroupContainer) => {
    const soundId =
      subgroupContainer.getAttribute("data-sound") || "1";

    /*
      لمس خود کادر زیرگروه صدا دارد.
      اگر روی دکمه زده شود، صدای دکمه فقط یک بار پخش می‌شود.
    */
    subgroupContainer.addEventListener("click", (event) => {
      if (!event.target.closest(".action-btn")) {
        playSubgroupSound(soundId);
      }
    });

    subgroupContainer.querySelectorAll(".action-btn").forEach(
      (button) => {
        button.addEventListener("click", async () => {
          playSubgroupSound(soundId);

          const selection = getButtonInformation(
            button,
            subgroupContainer
          );

          await requestAiAnswer(selection);
        });
      }
    );
  }
);

/* انیمیشن کوچک و بزرگ شدن کادرها هنگام اسکرول */
const subgroupObserver = new IntersectionObserver(
  (entries) => {
    entries.forEach((entry) => {
      if (entry.isIntersecting) {
        entry.target.classList.add("active-scroll");
      } else {
        entry.target.classList.remove("active-scroll");
      }
    });
  },
  {
    threshold: 0.15
  }
);

document.querySelectorAll(".subgroup-container").forEach(
  (subgroup) => {
    subgroupObserver.observe(subgroup);
  }
);
</script>
